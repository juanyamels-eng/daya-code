services:
  gateway:
    build:
      context: ../..
      dockerfile: packages/gateway/Dockerfile
    image: daya-gateway:latest
    container_name: daya-gateway
    ports:
      - "8787:8787"
    environment:
      GATEWAY_PORT: 8787
      GATEWAY_ADMIN_KEY: "${GATEWAY_ADMIN_KEY:-change-me}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      HF_API_KEY: "${HF_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Stripe checkout (optional). Set these to enable card payments that
      # auto-credit a user's quota via the /stripe/webhook endpoint.
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      GATEWAY_PUBLIC_URL: "${GATEWAY_PUBLIC_URL:-}"
    volumes:
      - daya-usage:/root/.daya/gateway
      - ./daya.gateway.json:/app/daya.gateway.json:ro
    restart: unless-stopped

volumes:
  daya-usage:
